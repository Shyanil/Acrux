[build]
  command = "node netlify-build.js"
  publish = "build"

[context.production.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
